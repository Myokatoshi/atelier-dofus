# Secours : rafraîchit les fichiers data/km/ du site avec les données d'Orukam publiées par Kamamaster (lancement manuel).
name: Prix Kamamaster
# Plus de passage planifié : la récupération se fait désormais dans Supabase (fonction « kamamaster », toutes les heures).
# Ce workflow ne sert plus qu'en secours, lancé à la main, pour rafraîchir les fichiers data/km/ du site.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kamamaster
  cancel-in-progress: false
jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Récupérer les prix d'Orukam
        run: python3 tools/fetch_kamamaster.py Orukam
      - name: Enregistrer et mettre en ligne
        run: |
          if git diff --quiet -- data/km; then echo "Aucun changement"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/km
          git commit -m "Données Kamamaster d'Orukam du $(date -u +%Y-%m-%d) à $(date -u +%H:%M) UTC"
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
